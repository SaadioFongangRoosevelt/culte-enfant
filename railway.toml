[build]
builder = "NIXPACKS"
buildCommand = "npm install -g pnpm@10 && pnpm install && pnpm --filter @workspace/culte-enfants run build && pnpm --filter @workspace/api-server run build"

[deploy]
startCommand = "node artifacts/api-server/dist/index.mjs"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
