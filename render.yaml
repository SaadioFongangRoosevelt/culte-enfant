services:
  - type: web
    name: culte-enfants-apc
    runtime: node
    plan: free
    buildCommand: npx pnpm@10 install && npx pnpm@10 --filter @workspace/culte-enfants run build && npx pnpm@10 --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: culte-enfants-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: culte-enfants-db
    databaseName: culte_enfants
    user: culte_enfants
    plan: free
